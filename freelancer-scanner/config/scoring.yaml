# Bewertungslogik des Scanners.
# Alle Werte hier sind ohne Programmierkenntnisse anpassbar.
# Nach Änderungen die Anwendung neu starten.

# ---------------------------------------------------------------
# Zwei getrennte Schwellwerte.
#
#   min_score    -> Ab hier bekommst du eine Telegram-Nachricht.
#                   Geprüft wird der opportunity_score (Qualität + Frische),
#                   denn eine Meldung ist zeitkritisch.
#
#   apply_score  -> Ab hier wird automatisch ein Bewerbungsentwurf erzeugt.
#                   Geprüft wird der overall_score (reine Qualität), denn
#                   das kostet Geld. Darunter jederzeit per Button im
#                   Dashboard nachholbar.
#
# Bewusst getrennt: melden ist billig, ein Entwurf kostet einen LLM-Aufruf.
# ---------------------------------------------------------------
min_score: 75
apply_score: 82

# Dein Ziel-Stundensatz in USD. Grundlage für die Budget-/Aufwand-Rechnung.
# Höher = der Scanner wird wählerischer.
target_hourly_rate_usd: 60

# ---------------------------------------------------------------
# Gewichtung der sechs Kriterien. Summe muss 1.0 ergeben.
# ---------------------------------------------------------------
weights:
  technical_fit: 0.22        # Wie gut mit KI / n8n / Make / Zapier / APIs lösbar
  automation_leverage: 0.18  # Wie viel manuelle Arbeit KI/Low-Code wirklich ersetzt
  budget_ratio: 0.18         # Budget im Verhältnis zum geschätzten Aufwand
  risk: 0.15                 # Technisches Risiko (invertiert)
  clarity: 0.13              # Wie klar ist die Aufgabe beschrieben
  reusability: 0.09          # Wiederverwendbarkeit für spätere Aufträge
  simplicity: 0.05           # Wenig Spezialprogrammierung nötig (invertiert)

# Warum diese Verteilung: automation_leverage misst weitgehend dasselbe wie
# "simplicity", nur aus der nützlicheren Richtung -- deshalb übernimmt es
# dessen Gewicht fast vollständig. Die restlichen Punkte kommen anteilig
# aus technical_fit, mit dem es sich teilweise überschneidet.

# ---------------------------------------------------------------
# Konservative Deckel ("Risiko-Bremse").
# Ein attraktives Budget kann ein riskantes Projekt NICHT hochziehen:
# greift ein Deckel, wird der Score hart auf diesen Wert begrenzt.
# Niedrigere Werte = vorsichtiger.
# ---------------------------------------------------------------
caps:
  risk_high: { threshold: 7, max_score: 55 }        # LLM-Risiko >= 7
  risk_critical: { threshold: 9, max_score: 40 }    # LLM-Risiko >= 9
  clarity_low: { threshold: 3, max_score: 50 }      # Beschreibung <= 3 (sehr unklar)
  difficulty_high: { threshold: 8, max_score: 50 }  # Schwierigkeit >= 8
  many_red_flags: { threshold: 3, max_score: 60 }   # 3 oder mehr Warnsignale
  employer_unverified: { max_score: 70 }            # Auftraggeber ohne Zahlungsnachweis
  no_budget: { max_score: 65 }                      # Kein Budget angegeben

# ---------------------------------------------------------------
# Frische-Bonus (nur für die Reihenfolge und die Meldung).
#
# Auf Freelancer.com sind gute Projekte nach 15-30 Minuten meist vergeben.
# Ein frischer Job mit wenigen Geboten ist deshalb mehr wert als ein
# gleich guter von gestern. Der overall_score bleibt davon unberührt --
# sonst wären spätere Auswertungen wertlos.
#
# Maximal erreichbar: age_bonus + bid_bonus = 10 Punkte.
# ---------------------------------------------------------------
freshness:
  age_bonus:               # Alter seit Veröffentlichung in Minuten
    - { max_minutes: 15,   bonus: 6 }
    - { max_minutes: 60,   bonus: 4 }
    - { max_minutes: 180,  bonus: 2 }
    - { max_minutes: 360,  bonus: 1 }
  bid_bonus:               # Wie viele Gebote schon abgegeben wurden
    - { max_bids: 5,       bonus: 4 }
    - { max_bids: 15,      bonus: 2 }
    - { max_bids: 30,      bonus: 1 }
  # Ist das Alter unbekannt, gibt es keinen Bonus -- nicht raten.
  unknown_age_bonus: 0

# ---------------------------------------------------------------
# ARBITRAGE-Kennzeichnung.
#
# Die Projekte, bei denen sich das Geschäftsmodell wirklich rechnet:
# hoher Automatisierungshebel, geringes Risiko, guter Stundensatz.
# Alle Bedingungen müssen erfüllt sein.
# ---------------------------------------------------------------
arbitrage:
  min_overall_score: 80
  min_automation_leverage: 8
  max_risk: 4
  min_effective_hourly_rate_usd: 60
  # Ausgeschlossene Technologien werden ohnehin vorgefiltert. Die Prüfung
  # läuft zur Sicherheit trotzdem noch einmal -- exclude.yaml kann sich
  # ändern, nachdem ein Projekt bereits bewertet wurde.

# ---------------------------------------------------------------
# Vorfilter: greift VOR dem LLM-Aufruf und spart damit Kosten.
# ---------------------------------------------------------------
prefilter:
  min_budget_usd: 100          # Projekte unter diesem Budget gar nicht erst bewerten
  min_description_chars: 120   # Zu kurze Beschreibungen sind nicht bewertbar
  max_existing_bids: 60        # Bei mehr Geboten ist der Zug meist abgefahren
  skip_if_no_budget: false     # true = Projekte ohne Budgetangabe überspringen

# ---------------------------------------------------------------
# Grobe Umrechnungskurse in USD. Nur Näherungswerte für die
# Budget-Rechnung, keine Buchhaltung. Bei Bedarf anpassen.
# ---------------------------------------------------------------
currency_rates_usd:
  USD: 1.0
  EUR: 1.09
  GBP: 1.27
  CAD: 0.74
  AUD: 0.66
  NZD: 0.61
  CHF: 1.13
  SGD: 0.74
  INR: 0.012
  ZAR: 0.055
  HKD: 0.128
